<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O Bom Pastor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
:root{--bg:#24331f;--fg:#2b2a26;--card:rgba(255,252,243,.95);--line:#d9cfae;--ac:#2f7d4f;--acfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#f1eee4;--card:rgba(28,34,32,.95);--line:#46503f;--ac:#6cc795;--acfg:#10241a}}
:root[data-theme="dark"]{--fg:#f1eee4;--card:rgba(28,34,32,.95);--line:#46503f;--ac:#6cc795;--acfg:#10241a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);font-family:"Baloo 2",system-ui,sans-serif}
#stage{position:relative;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#bub{position:absolute;top:34px;left:5%;right:5%;background:#fbf3e4;color:#3b2f2a;border-radius:26px;border:3px solid #f6d58a;padding:32px 16px 14px;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.35);transition:opacity .4s,transform .4s}
#bub.hide{opacity:0;transform:translateY(-12px);pointer-events:none}
#bub::after{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-14px;border:14px solid transparent;border-bottom:0;border-top-color:#fbf3e4}
#av{position:absolute;top:-18px;left:50%;margin-left:-22px;width:44px;height:44px;border-radius:50%;border:3px solid #2b2420;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}
#bn{font-size:15px;font-weight:600}
#bt{margin:0;font-size:clamp(26px,8vw,40px);line-height:1.05;font-weight:800}
#br{display:inline-block;margin:6px 0;background:#c0495a;color:#fff;border-radius:999px;padding:2px 16px;font-weight:800;font-size:15px}
#bv{margin:4px 0;font-style:italic;font-size:15px;line-height:1.3}
#be{margin:4px 0 0;font-size:14px;line-height:1.3;opacity:.85}
#hud{position:absolute;top:6px;left:8px;background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:2px 12px;font-size:14px;font-weight:600}
#start{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,16,10,.6)}
#start.off{display:none}
#go{font:800 22px "Baloo 2",system-ui,sans-serif;padding:16px 26px;border-radius:18px;border:0;background:#f4c95d;color:#3b2f2a;cursor:pointer}
#tg{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:20px;cursor:pointer}
#panel{position:absolute;left:10px;right:62px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;color:var(--fg)}
#panel.off{display:none}
#panel input{flex:1 1 120px;min-width:0;font:16px system-ui,sans-serif;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg)}
#panel button{font:600 14px system-ui,sans-serif;padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
#panel button.p{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<div id="stage">
<canvas id="c"></canvas>
<div id="hud">🐑 <b id="n">0</b></div>
<div id="bub" class="hide"><div id="av"></div><div id="bn"></div><h1 id="bt"></h1><span id="br"></span><p id="bv"></p><p id="be"></p></div>
<div id="start"><button id="go">Começar com voz 🔊</button></div>
<div id="panel">
<input id="nm" maxlength="14" placeholder="@ do espectador" autocomplete="off">
<input id="ms" maxlength="80" placeholder="comentário (ex.: perdão)" autocomplete="off">
<button class="p" id="b1">Enviar comentário</button>
<button id="b2">Abraço 🤗</button>
<button id="b3">Gratidão ✨</button>
<button id="b4">Florescer 🌼</button>
<button id="b5">+20 ovelhas</button>
<button id="b6">Voz: ligada</button>
<select id="gf" style="font:15px system-ui,sans-serif;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)"><option value="coracoes">Corações</option><option value="chuva">Chuva de pétalas</option><option value="arco">Arco-íris</option><option value="luz">Luz divina</option><option value="fogos">Fogos</option><option value="borboletas">Borboletas</option><option value="pombas">Pombas</option><option value="ouro">Ovelha de ouro</option><option value="coroa">Coroa de flores</option><option value="galaxia">Galáxia</option><option value="milagre">Milagre</option></select>
<button id="b7">Testar presente</button>
</div>
<button id="tg" aria-label="Mostrar ou ocultar painel de teste">⚙️</button>
</div>

function speak(text){
  const ss=speechSynthesis;ss.resume();
  const ut=new SpeechSynthesisUtterance(text);ut.lang="pt-BR";ut.rate=.92;ut.pitch=.95;ut.volume=1;
  const pv=ss.getVoices().find(x=>x.lang&&x.lang.toLowerCase().replace("_","-").startsWith("pt"));
  if(pv)ut.voice=pv;
  window.__ut=ut;
  if(ss.speaking||ss.pending){ss.cancel();setTimeout(()=>ss.speak(ut),150)}else ss.speak(ut);
  return ut;
}

  if(voiceOn&&"speechSynthesis"in window){
    const ut=speak(say);ut.onend=done;ut.onerror=()=>{note("🔇 o navegador bloqueou a voz");done()};
    setTimeout(done,say.length*95+5000);
  }else{if(voiceOn)note("🔇 sem voz neste navegador: abra o link no Chrome");setTimeout(done,say.length*65+1500)}
}
function comment(name,msg){
  name=(name||"").trim().slice(0,14)||"Ovelhinha";
  if(!sheep.some(s=>s.name===name))addSheep(name);
  if(queue.length<5)queue.push({name,v:pickV(msg)});
}
function hug(){
  sheep.forEach(s=>{s.hopT=1+Math.random()*.4;s.rush=3;s.tx=W/2+rnd(-W*.35,W*.35);s.ty=H*.76+rnd(0,H*.08);s.wait=0});
  for(let i=0;i<10;i++)fx.push({x:W/2+rnd(-60,60),y:H*.45,vx:rnd(-30,30),vy:rnd(-70,-30),life:1.8,ch:"♥",col:"#ff6f91",sz:rnd(18,28)});
}
function special(name,kind){
  name=(name||"").trim().slice(0,14)||(kind==="g"?"galáxia":kind==="o"?"ouro":"flores");
  let s=sheep.find(z=>z.name===name);if(!s)s=addSheep(name);
  s.kind=kind;s.x=W/2;s.y=H*.84;s.hopT=1.4;s.wait=2;
}
function thanks(name){
  special(name,"g");gal=7;
  for(let i=0;i<30;i++)fx.push({x:W/2,y:H*.5,vx:rnd(-120,120),vy:rnd(-140,40),life:rnd(1,2),ch:"✦",col:"#c9b8ff",sz:rnd(12,24)});
}
function bloom(name){
  special(name,"f");
  for(let i=0;i<14;i++){if(flw.length>=120)flw.shift();flw.push({x:Math.random(),y:rnd(.4,1),c:["#ffcf4a","#ff8fb1","#ff9a3c"][i%3]})}
  for(let i=0;i<14;i++)fx.push({x:rnd(0,W),y:-10,vx:rnd(-15,15),vy:rnd(40,90),life:3,ch:"❀",col:"#ff8fb1",sz:rnd(14,22)});
}
window.TikTokGame={comment,like:hug,gift:thanks,bloom,giftEvent};

function burstE(c,n,o){o=o||{};for(let i=0;i<n;i++)fx.push({x:o.x!=null?o.x:rnd(0,W),y:o.y!=null?o.y:H*.5,vx:rnd(-(o.vx||60),o.vx||60),vy:rnd(o.v0!=null?o.v0:-130,o.v1!=null?o.v1:-30),life:rnd(1.5,3),ch:c[i%c.length],col:o.col||"#ff6f91",sz:rnd(16,30)})}
let rb=0,ray=0;
const AN={
  coracoes:()=>{burstE(["♥","💗","💛"],26,{x:W/2,y:H*.45,vx:90});hug()},
  chuva:()=>{for(let i=0;i<40;i++)fx.push({x:rnd(0,W),y:rnd(-H*.3,-10),vx:rnd(-20,20),vy:rnd(40,110),life:5,ch:["❀","🌸","♥"][i%3],col:"#ff8fb1",sz:rnd(14,26)})},
  arco:()=>{rb=6},
  luz:()=>{ray=6;sheep.forEach(s=>{s.hopT=1.2})},
  fogos:()=>{for(let i=0;i<5;i++)setTimeout(()=>burstE(["✦","✧","⭐"],16,{x:rnd(W*.15,W*.85),y:rnd(H*.15,H*.4),vx:120,v0:-90,v1:60,col:"#ffd54a"}),i*450)},
  borboletas:()=>burstE(["🦋"],14,{y:H*.8,vx:80,v0:-70,v1:-20}),
  pombas:()=>{for(let i=0;i<8;i++)fx.push({x:-20-i*30,y:rnd(H*.1,H*.4),vx:rnd(90,150),vy:rnd(-15,5),life:6,ch:"🕊️",col:"#fff",sz:rnd(22,32)})},
  ouro:n=>{special(n,"o");burstE(["✦"],20,{x:W/2,y:H*.6,col:"#ffd54a",vx:110})},
  coroa:n=>bloom(n),
  galaxia:n=>thanks(n),
  milagre:n=>{AN.luz();AN.arco();AN.galaxia(n);sheep.forEach(s=>{if(s.kind==="n")s.kind="f"})}
};
const MAP=[[/rosa|rose/,"coroa"],[/universo|universe/,"milagre"],[/galax/,"galaxia"],[/leao|lion|ouro|gold|rei|king|coroa|crown/,"ouro"],[/coracao|heart|amor|love|finger|abraco|hug/,"coracoes"],[/arco|rainbow/,"arco"],[/pomba|dove|paz/,"pombas"],[/borbol|butterf/,"borboletas"],[/fogo|firework|foguete|rocket/,"fogos"],[/luz|light|estrela|star/,"luz"],[/flor|flower|petal/,"chuva"]];
function giftEvent(name,gift,dia,cnt){
  const g=norm(gift||"");let a=(MAP.find(m=>m[0].test(g))||[])[1];
  if(!a){const d=dia||0;a=d<5?"coracoes":d<30?"borboletas":d<100?"chuva":d<500?"arco":d<1000?"pombas":d<5000?"galaxia":"milagre"}
  for(let i=0;i<Math.min(cnt||1,3);i++)setTimeout(()=>AN[a](name),i*700);
}
function drawFx2(dt){
  if(rb>0){rb-=dt;const a=Math.sin(Math.min(1,Math.max(0,1-rb/6))*Math.PI),cols=["#ff6b6b","#ffa94d","#ffe066","#8ce99a","#74c0fc","#9775fa"];
    ctx.globalAlpha=.8*a;ctx.lineWidth=u*.5;cols.forEach((c,k)=>{ctx.strokeStyle=c;ctx.beginPath();ctx.arc(W/2,H*.7,W*.6-k*u*.5,Math.PI,0);ctx.stroke()});ctx.globalAlpha=1}
  if(ray>0){ray-=dt;const a=Math.sin(Math.min(1,Math.max(0,1-ray/6))*Math.PI);
    for(let i=0;i<7;i++){const bx=W/2+(i-3)*W*.2,tx=W/2+(i-3)*12;ctx.fillStyle="rgba(255,240,170,"+.22*a+")";ctx.beginPath();ctx.moveTo(tx,0);ctx.lineTo(tx+22,0);ctx.lineTo(bx+40,H*.85);ctx.lineTo(bx-40,H*.85);ctx.fill()}}
}
function step(dt){
  if(started&&!cur){
    if(queue.length)show(queue.shift());
    else{idle-=dt;if(idle<=0)show({name:"Minhas ovelhinhas",v:V[Math.floor(Math.random()*V.length)]})}
  }
  for(const s of sheep){
    if(s.hopT>0)s.hopT-=dt*1.2;
    if(s.rush>0)s.rush-=dt;
    if(s.wait>0){s.wait-=dt;continue}
    const dx=s.tx-s.x,dy=s.ty-s.y,dd=Math.hypot(dx,dy);
    if(dd<3){pick(s);continue}
    const sp=s.rush>0?80:20;
    s.x+=dx/dd*sp*dt;s.y+=dy/dd*sp*dt;if(Math.abs(dx)>2)s.dir=dx>0?1:-1;
  }
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.life-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=30*dt;if(f.life<=0)fx.splice(i,1)}
}
const IM={};
["jesus","meadow","lamb"].forEach(k=>{const i=new Image();i.src=DATA[k];IM[k]=i});
function flower(f,col){
  const s=.6+f.y*.8,x=f.x*W,y=f.y*H;
  ctx.fillStyle="#fff";
  for(let i=0;i<5;i++){const a=i*1.2566;ctx.beginPath();ctx.arc(x+Math.cos(a)*4*s,y+Math.sin(a)*4*s,3*s,0,7);ctx.fill()}
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,2.4*s,0,7);ctx.fill();
}
function scene(t){
  const m=IM.meadow;
  if(m.complete&&m.naturalWidth){const k=Math.max(W/m.naturalWidth,H/m.naturalHeight),w=m.naturalWidth*k,h=m.naturalHeight*k;ctx.drawImage(m,(W-w)/2,(H-h)/2,w,h)}
  else{ctx.fillStyle="#6fb84a";ctx.fillRect(0,0,W,H)}
  for(const f of flw)flower(f,f.c);
}
function jesus(t){
  const im=IM.jesus;if(!im.complete||!im.naturalWidth)return;
  const h=Math.min(H*.56,W*1.5)*.762,w=h*im.naturalWidth/im.naturalHeight,cx=W/2,by=H*.73,bob=Math.sin(t*1.6)*3;
  const g=ctx.createRadialGradient(cx,by-h*.7,10,cx,by-h*.7,h*.55);
  g.addColorStop(0,"rgba(255,236,150,"+(speaking?.7:.4)+")");g.addColorStop(1,"rgba(255,236,150,0)");
  ctx.fillStyle=g;ctx.fillRect(cx-h*.6,by-h*1.25,h*1.2,h*1.1);
  const sq=speaking?1+.015*Math.sin(t*12):1;
  ctx.save();ctx.translate(cx,by+bob);ctx.scale(1/sq,sq);ctx.drawImage(im,-w/2,-h,w,h);ctx.restore();
}
function badge(s,x,y,r){
  const f=Math.max(11,r*.5);ctx.font="700 "+f+"px 'Baloo 2',system-ui,sans-serif";
  const h=f*1.7,w=ctx.measureText(s.name).width+h+f*.6;
  ctx.fillStyle="rgba(176,182,205,.92)";ctx.strokeStyle="#fff";ctx.lineWidth=1.5;
  ctx.beginPath();(ctx.roundRect||ctx.rect).call(ctx,x-w/2,y,w,h,h/2);ctx.fill();ctx.stroke();
  ctx.fillStyle=s.col;ctx.beginPath();ctx.arc(x-w/2+h/2,y+h/2,h*.4,0,7);ctx.fill();
  ctx.textBaseline="middle";ctx.textAlign="center";ctx.fillStyle="#fff";ctx.fillText(s.name[0].toUpperCase(),x-w/2+h/2,y+h/2+1);
  ctx.textAlign="left";ctx.fillStyle="#2c3350";ctx.fillText(s.name,x-w/2+h+f*.1,y+h/2+1);ctx.textBaseline="alphabetic";
}
const SP={};
function mk(kind){
  const c=document.createElement("canvas"),S=2;c.width=c.height=160*S;const x=c.getContext("2d");x.scale(S,S);
  if(kind==="g"||kind==="o"){x.shadowColor=kind==="g"?"#a78bff":"#ffd54a";x.shadowBlur=14}
  x.drawImage(IM.lamb,0,0,160,160);x.shadowBlur=0;
  if(kind==="g"){
    x.globalCompositeOperation="source-atop";x.fillStyle="rgba(91,63,184,.55)";x.fillRect(0,0,160,160);
    x.globalCompositeOperation="source-over";x.fillStyle="#fff";
    for(let i=0;i<22;i++){const a=i*2.4,r=i*37%34;x.fillRect(80+Math.cos(a)*r*1.9,105+Math.sin(a)*r*.9,2,2)}
  }
  if(kind==="o"){x.globalCompositeOperation="source-atop";x.fillStyle="rgba(255,196,50,.45)";x.fillRect(0,0,160,160);x.globalCompositeOperation="source-over"}
  if(kind==="f"){
    const cols=["#ff8fb1","#ffd24a","#ffffff","#ff9a6b","#ff8fb1","#ffd24a","#ffffff"];
    for(let i=0;i<7;i++){
      const a=Math.PI*(1.12+i*.126),px=80+Math.cos(a)*38,py=46+Math.sin(a)*38;
      x.fillStyle="#6cbf5a";x.beginPath();x.ellipse(px+Math.cos(a+1.57)*7,py+Math.sin(a+1.57)*7,6,3,a,0,7);x.fill();
      x.fillStyle=cols[i];x.strokeStyle="rgba(150,90,90,.5)";x.lineWidth=1;
      for(let k=0;k<5;k++){const b=k*1.2566;x.beginPath();x.arc(px+Math.cos(b)*4.5,py+Math.sin(b)*4.5,4,0,7);x.fill();x.stroke()}
      x.fillStyle="#ffb02e";x.beginPath();x.arc(px,py,3,0,7);x.fill();
    }
  }
  return c;
}
function sprite(k){return SP[k]||(IM.lamb.complete&&IM.lamb.naturalWidth?(SP[k]=mk(k)):null)}
function drawSheep(s,t){
  const sp=sprite(s.kind);if(!sp)return;
  const d=Math.max(.6,Math.min(1.25,.6+(s.y/H-.72)*2.4)),w=u*2.6*d*(s.kind==="n"?1:1.25);
  const wob=s.wait<=0?Math.sin(t*8+s.x*.05)*.07:0;
  const hop=s.hopT>0?-Math.abs(Math.sin(s.hopT*9))*w*.5:0;
  ctx.fillStyle="rgba(0,0,0,.18)";ctx.beginPath();ctx.ellipse(s.x,s.y,w*.32,w*.06,0,0,7);ctx.fill();
  ctx.save();ctx.translate(s.x,s.y+hop);ctx.rotate(wob);ctx.drawImage(sp,-w/2,-w*.93,w,w);ctx.restore();
  if(s.kind==="g"&&Math.random()<.05)fx.push({x:s.x+rnd(-w/2,w/2),y:s.y-w*rnd(.2,1),vx:0,vy:-15,life:1,ch:"✦",col:"#c9b8ff",sz:rnd(10,16)});
  if(s.name&&(s.kind!=="n"||sheep[sheep.length-1].q-s.q<50))badge(s,s.x,s.y+hop+w*.02,w*.4);
}
let gal=0;const GJ=Array.from({length:360},()=>Math.random());
function drawGal(dt){
  if(gal<=0)return;gal-=dt;
  const p=Math.min(1,Math.max(0,1-gal/7)),a=Math.sin(p*Math.PI),t=p*7,cx=W/2,cy=H*.5,R=Math.min(W,H)*.48;
  ctx.fillStyle="rgba(12,8,48,"+.62*a+")";ctx.fillRect(0,0,W,H);
  for(let i=0;i<60;i++){ctx.fillStyle="rgba(255,255,255,"+a*(.5+.5*Math.sin(t*4+i))+")";ctx.fillRect(GJ[i]*W,GJ[(i*7)%360]*H,2,2)}
  const g=ctx.createRadialGradient(cx,cy,2,cx,cy,R*.45);g.addColorStop(0,"rgba(255,200,240,"+.7*a+")");g.addColorStop(1,"rgba(255,200,240,0)");
  ctx.fillStyle=g;ctx.fillRect(cx-R,cy-R,R*2,R*2);
  for(let i=0;i<360;i++){
    const f=Math.pow(i/360,.7),rr=f*R,ang=f*5+(i%3)*2.094+t*.5+(GJ[i]-.5)*.6*(1.3-f);
    ctx.fillStyle="hsla("+(270+f*90)+",90%,"+(85-f*20)+"%,"+a+")";
    ctx.beginPath();ctx.arc(cx+Math.cos(ang)*rr,cy+Math.sin(ang)*rr*.6,1+(1-f)*2.2,0,7);ctx.fill();
  }
}
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const t=now/1000;step(dt);scene(t);drawFx2(dt);
  let jd=false;for(const s of sheep.slice().sort((a,b)=>a.y-b.y)){if(!jd&&s.y>H*.73){jesus(t);jd=true}drawSheep(s,t)}
  if(!jd)jesus(t);
  drawGal(dt);
  for(const f of fx){ctx.globalAlpha=Math.max(0,Math.min(1,f.life));ctx.fillStyle=f.col;ctx.font=f.sz+"px sans-serif";ctx.textAlign="center";ctx.fillText(f.ch,f.x,f.y)}
  ctx.globalAlpha=1;
  const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(20,50,20,.22)");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  requestAnimationFrame(loop);
}
function send(){comment($("nm").value,$("ms").value);$("ms").value=""}
$("go").onclick=()=>{started=true;$("start").classList.add("off");idle=99;
  if("speechSynthesis"in window){const u=speak("A paz do Senhor, minhas ovelhinhas.");u.onend=()=>{idle=.5};u.onerror=()=>{note("🔇 o navegador bloqueou a voz");idle=.5};setTimeout(()=>{if(idle>50)idle=.5},6000)}
  else{note("🔇 sem voz neste navegador: abra o link no Chrome");idle=1}};
$("b1").onclick=send;
$("ms").addEventListener("keydown",e=>{if(e.key==="Enter")send()});
$("b2").onclick=hug;
$("b3").onclick=()=>thanks($("nm").value);
$("b4").onclick=()=>bloom($("nm").value);
$("b5").onclick=()=>{for(let i=0;i<20;i++)addSheep("")};
$("b6").onclick=e=>{voiceOn=!voiceOn;e.target.textContent="Voz: "+(voiceOn?"ligada":"desligada");if(!voiceOn&&"speechSynthesis"in window)speechSynthesis.cancel()};
$("b7").onclick=()=>AN[$("gf").value]($("nm").value);
$("tg").onclick=()=>$("panel").classList.toggle("off");
requestAnimationFrame(loop);

;(function(){
  if(/claude/i.test(location.hostname)||location.protocol==="file:")return;
  let t=0;
  function conn(){
    const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");
    ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}
      if(m.t==="chat")comment(m.name,m.text);
      else if(m.t==="gift")giftEvent(m.name,m.gift,m.diamonds,m.count);
      else if(m.t==="like"){if(Date.now()-t>4000){t=Date.now();hug()}}
      else if(m.t==="join"&&!sheep.some(z=>z.name===m.name))addSheep(m.name)};
    ws.onclose=()=>setTimeout(conn,3000);
  }
  conn();
})();
